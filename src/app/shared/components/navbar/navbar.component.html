<a class="skip-link" href="#main">Skip to content</a>
<aside class="sidebar">
  <a class="brand" [routerLink]="auth.isAdmin() ? '/admin' : '/dashboard'"
    ><span class="brand-mark">b.</span> baas<span class="brand-light"
      >bank</span
    ></a
  >
  <button
    class="menu-toggle"
    (click)="expanded.set(!expanded())"
    [attr.aria-expanded]="expanded()"
    aria-controls="primary-nav"
  >
    Menu ☰
  </button>
  <nav
    id="primary-nav"
    aria-label="Main navigation"
    [class.expanded]="expanded()"
  >
    <span class="nav-caption">YOUR WORKSPACE</span>
    @if (auth.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active"
        ><span aria-hidden="true">▦</span> Operations</a
      >
    } @else {
      <a routerLink="/dashboard" routerLinkActive="active"
        ><span aria-hidden="true">▦</span> Overview</a
      >
      <a routerLink="/accounts" routerLinkActive="active"
        ><span aria-hidden="true">▤</span> Accounts</a
      >
      <a routerLink="/payments" routerLinkActive="active"
        ><span aria-hidden="true">↗</span> Payments</a
      >
      <a routerLink="/transactions" routerLinkActive="active"
        ><span aria-hidden="true">⇄</span> Transactions</a
      >
    }
    <button class="mobile-logout" (click)="auth.logout()">Sign out ↗</button>
  </nav>
  <div class="sidebar-bottom">
    <div class="secure-note">
      <span class="live-dot"></span> Your banking workspace
    </div>
    <div class="profile">
      <span class="avatar">{{ auth.name().charAt(0) }}</span>
      <div>
        <strong>{{ auth.name() }}</strong
        ><small>{{
          auth.isAdmin() ? "Administrator" : "Personal account"
        }}</small>
      </div>
    </div>
    <button class="logout" (click)="auth.logout()">
      Sign out <span aria-hidden="true">↗</span>
    </button>
  </div>
</aside>
